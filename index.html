
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VAQZILO Marketplace</title>
<style>
body{font-family:Arial;margin:0;background:#f4f6fa;color:#222}
header{background:#151b35;color:white;padding:18px;text-align:center}
nav{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;padding:12px}
button{background:#2563eb;color:white;border:0;border-radius:8px;padding:11px;cursor:pointer}
input{padding:12px;border:1px solid #ccc;border-radius:8px;box-sizing:border-box;width:100%;margin:5px 0}
section{background:white;margin:14px;padding:18px;border-radius:12px}
.product{border:1px solid #ddd;padding:14px;margin:10px 0;border-radius:10px}
.price{color:green;font-weight:bold}
</style>
</head>
<body>
<header>
<h1>VAQZILO</h1>
<p>Buy & Sell Marketplace</p>
</header>

<nav>
<button onclick="show('shop')">Shop</button>
<button onclick="show('seller')">Sell</button>
<button onclick="show('cart')">Cart 🛒 <span id="count">0</span></button>
<button onclick="show('account')">Account</button>
</nav>

<section id="shop">
<h2>Explore Products</h2>
<input id="search" placeholder="Search products..." oninput="render()">
<div id="products"></div>
</section>

<section id="seller" hidden>
<h2>Sell Your Product</h2>
<input id="name" placeholder="Product name">
<input id="price" type="number" min="0.01" step="0.01" placeholder="Price CAD">
<input id="description" placeholder="Description">
<button onclick="addProduct()">Publish Product</button>
<p id="sellerMessage"></p>
</section>

<section id="cart" hidden>
<h2>Your Shopping Cart</h2>
<div id="cartItems"></div>
<h3 id="total"></h3>
<button onclick="checkout()">Demo Checkout</button>
<p id="checkoutMessage"></p>
</section>

<section id="account" hidden>
<h2>Customer / Seller Account</h2>
<input id="username" placeholder="Your name">
<input id="email" type="email" placeholder="Email">
<button onclick="saveAccount()">Save Demo Profile</button>
<p id="accountMessage"></p>
</section>

<script>
const initial=[
{name:"Wireless Headphones",price:39.99,description:"Bluetooth headphones"},
{name:"Smart Watch",price:59.99,description:"Everyday smartwatch"},
{name:"Kitchen Organizer",price:24.99,description:"Home storage organizer"}
];
let products=JSON.parse(localStorage.getItem("vq_products")||"null")||initial;
let cart=[];

function show(id){
document.querySelectorAll("section").forEach(s=>s.hidden=true);
document.getElementById(id).hidden=false;
if(id==="cart")renderCart();
}
function render(){
let q=document.getElementById("search").value.toLowerCase();
let box=document.getElementById("products");
box.innerHTML="";
products.forEach((p,i)=>{
if(!p.name.toLowerCase().includes(q))return;
let div=document.createElement("div");
div.className="product";
let title=document.createElement("h3");
title.textContent=p.name;
let price=document.createElement("p");
price.className="price";
price.textContent="$"+Number(p.price).toFixed(2)+" CAD";
let desc=document.createElement("p");
desc.textContent=p.description;
let btn=document.createElement("button");
btn.textContent="Add to Cart";
btn.onclick=()=>{cart.push(i);updateCount();alert("Added to cart!")};
div.append(title,price,desc,btn);
box.append(div);
});
}
function addProduct(){
let name=document.getElementById("name").value.trim();
let price=Number(document.getElementById("price").value);
let description=document.getElementById("description").value.trim();
if(!name||!Number.isFinite(price)||price<=0){
alert("Enter a product name and valid price");return;
}
products.push({name,price,description});
localStorage.setItem("vq_products",JSON.stringify(products));
document.getElementById("sellerMessage").textContent="Product saved in this browser!";
document.getElementById("name").value="";
document.getElementById("price").value="";
document.getElementById("description").value="";
render();
}
function updateCount(){
document.getElementById("count").textContent=cart.length;
}
function renderCart(){
let box=document.getElementById("cartItems");
box.innerHTML="";
let total=0;
cart.forEach(i=>{
let p=products[i];
total+=Number(p.price);
let line=document.createElement("p");
line.textContent=p.name+" — $"+Number(p.price).toFixed(2);
box.append(line);
});
document.getElementById("total").textContent="Total: $"+total.toFixed(2)+" CAD";
}
function checkout(){
document.getElementById("checkoutMessage").textContent=
"Demo only — no payment or real order placed.";
}
function saveAccount(){
let name=document.getElementById("username").value.trim();
let email=document.getElementById("email").value.trim();
if(!name||!email.includes("@")){
alert("Enter your name and valid email");return;
}
document.getElementById("accountMessage").textContent=
"Demo profile saved for this session. Not a real account.";
}
render();
</script>
</body>
</html>
